# The composition layer this bundle contributes.
#
# Declaring `dsh.bundle.patch` is what turns this package from an inert dependency into
# a *profile layer*: the profile engine reads this file and applies it, and DSH's own
# plugin manager will install and manage the package instead of refusing it.
#
# The row names the package by its bare name. Bare names resolve through the profile —
# which is where the plugin manager installs bundles — whereas a relative path would
# resolve beside this file, inside the package, and would not match that layout.

- insert:
    - id: deepwork-ontology
      name: '@zhangcun123/ontology'
      config:
        # A domain pack is data, so it is configured rather than compiled in. With
        # nothing set the plugin loads no domain and says so, instead of silently
        # registering no tools.
        ontologyRoot: !!js process.env.DEEPWORK_ONTOLOGY_ROOT ?? ''
        # Who may write is the gate on the write tool: an empty role map means the
        # tool is not registered at all, so an unconfigured deployment is a read-only
        # one rather than a permissive one. Roles are matched by agent id prefix, and
        # a prefix of `*` matches every caller — the way to state the role this
        # deployment acts as rather than inferring one from ids the host generates.
        # Quoted because a bare scalar would let YAML read the ` : ` in the ternary as
        # a mapping separator.
        roles: !!js 'process.env.DEEPWORK_ONTOLOGY_ROLES ? JSON.parse(process.env.DEEPWORK_ONTOLOGY_ROLES) : []'
        # Write attempts are recorded here, refusals included. Defaults to
        # `.audit.jsonl` beside the domain.
        auditLog: !!js process.env.DEEPWORK_ONTOLOGY_AUDIT || null
        # The situation this deployment is in, as comma-separated `key:value` tags. It marks whichever
        # of the domain's vouched-for rules the platform can see applying right now, so which rules
        # are in play is answered by the world rather than by the model — and the role tag among them
        # is the one thing that also filters, because a role is declared rather than inferred from an
        # object's state. Comma-separated and not JSON: it is the grammar the domain already tags its
        # rules with, and it needs no quoting to survive a shell. Unset means nothing is marked and
        # every vouched-for rule is injected, which is the safe direction for a requirement to be
        # wrong in.
        situation: !!js process.env.DEEPWORK_ONTOLOGY_SITUATION ?? ''
        # What this session is working on: an object id (`CASE-1042`) or a product id
        # (`DLV-RELEASE_NOTES`). This is the half a person can see and copy — the tags above are a
        # vocabulary they have to remember, and naming the thing is not. The object's own state
        # supplies the tag half the domain maps it to, so `situation` above carries what a state
        # cannot say, which in practice is the role.
        active: !!js process.env.DEEPWORK_ONTOLOGY_ACTIVE ?? ''
        # Ceiling on the injected rules, in characters. A backstop, not a target: a domain grows
        # and a prompt does not, so the day they cross this has to already be in place. At 32000
        # roughly 230 rules fit, and the domain this was built against vouches for 71. Note that
        # `0` is taken literally and means "inject no rules", so it is not the way to say "no
        # ceiling" — a large number is. Quoted for the same reason `roles` is: a bare scalar would
        # let YAML read the ` : ` in the ternary as a mapping separator.
        budget: !!js 'process.env.DEEPWORK_ONTOLOGY_BUDGET ? Number(process.env.DEEPWORK_ONTOLOGY_BUDGET) : 32000'
