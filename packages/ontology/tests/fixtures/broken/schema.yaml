version: "1.0"

# Fixture domain: deliberately malformed, one problem per declaration, to pin the
# failure policy. Every defect here must surface as a warning rather than silently
# degrading a query result — except a broken schema file, which must throw.

object_types:
  Widget:
    primary_key: widget_id
    required_fields: [widget_id]
    file_location: objects/widgets/W-*.yaml
    fields:
      widget_id: { type: string, required: true }
      mounts: { type: ref, to: Gadget }

  Gadget:
    # No `file_location`: there is nowhere to look for instances.
    required_fields: [gadget_id]

  Sprocket:
    # `file_location` names a directory that does not exist on disk.
    primary_key: sprocket_id
    file_location: objects/sprockets/S-*.yaml

  Doohickey:
    # Neither `primary_key` nor `required_fields`, so identity can only come from
    # the filename.
    file_location: objects/doohickeys/D-*.yaml

link_types:
  mounts:
    from: Widget
    to: Gadget
  missing_target:
    # Missing `to`: the declaration cannot describe a directed edge.
    from: Widget
  unknown_target:
    # Target type was never declared, so every edge resolves to nothing.
    from: Widget
    to: Nonexistent
  phantom_source:
    # Source type was never declared, so this relation can never match an object.
    from: Phantom
    to: Widget
  unwired:
    # Both types are declared and Widget has instances, but no instance carries
    # `unwired`, so this relation can never produce an edge.
    from: Widget
    to: Widget

functions:
  # One defect per declaration, so each rejection path is pinned by its own warning.
  # The last entry is sound and must survive, which proves the others were dropped
  # individually rather than the whole block being abandoned.
  missing_use:
    on: Widget
  unknown_use:
    use: explode
    on: Widget
  filter_without_on:
    use: filter_by
  filter_on_undeclared:
    use: filter_by
    on: Nonexistent
  traverse_without_relation:
    use: traverse
    by: from_id
  traverse_unknown_relation:
    use: traverse
    relation: not_a_relation
    by: from_id
  search_without_by:
    use: search
    on: Widget
  bad_direction:
    use: traverse
    relation: mounts
    direction: sideways
    by: from_id
  sound_mode:
    description: Every widget.
    use: filter_by
    on: Widget

action_types:
  # Same policy as `functions`: one defect per declaration, pinning each rejection path.
  # Unlike `functions` there is no survivor here, and that is not an oversight — every type in
  # this domain declares no `written_by` (a separate warning, and one a test relies on), so an
  # action that would otherwise be sound still has nobody permitted to invoke it. A whole
  # declared action deriving into a working tool is covered by `project-delivery`.
  action_targets_undeclared_type:
    use: create
    target: Nonexistent
  action_names_a_field_the_type_lacks:
    use: create
    target: Widget
    fields: [widget_id, mounts_typo]
  action_use_is_neither_create_nor_update:
    use: created
    target: Widget
