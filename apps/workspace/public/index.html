<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepWork — workspace</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">DW</span>
      <div>
        <h1>DeepWork workspace</h1>
        <p class="tagline">
          Point it at a domain. What you see below is what the engine derived from it —
          the tools the agent would be given, and the permissions gating them.
        </p>
      </div>
    </div>
    <div class="controls">
      <label for="domain">domain</label>
      <select id="domain"></select>
      <label for="roles">roles <span id="roles-hint">(JSON; empty means no write tool)</span></label>
      <input id="roles" spellcheck="false" value="">
      <button id="reload">Inspect</button>
    </div>
  </header>

  <section class="summary" id="summary"></section>
  <main id="out"></main>
  <footer id="foot"></footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
